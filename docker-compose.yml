# Production stack: the office, HTTPS with automatic certificates (Caddy), and a TURN relay for calls (coturn).
# Copy .env.example to .env, set your domain and secrets, then run: docker compose up -d
services:
  office:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3001
    volumes:
      - office-data:/app/server/data
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      OFFICE_DOMAIN: ${OFFICE_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [office]
  turn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command: >
      -n --listening-port=3478 --fingerprint --lt-cred-mech
      --user=${TURN_USERNAME}:${TURN_PASSWORD} --realm=${OFFICE_DOMAIN}
      --min-port=49160 --max-port=49200 --no-cli --no-tlsv1 --no-tlsv1_1
volumes:
  office-data:
  caddy-data:
