# LiveKit media server for meeting rooms. Keys must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in .env.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
keys:
  # Replace both values (the secret needs at least 32 characters).
  office: change-me-livekit-secret-at-least-32-characters
